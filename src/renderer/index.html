<html lang="en">
  <head>

    <!-- Same policy as AIHub Browser's app shell: YouTube's embed hosts for the
         players, https images for covers, aihub-media: for local music. -->

    <title>AIHub DJ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous" media="print" onload="this.media='all'" />
