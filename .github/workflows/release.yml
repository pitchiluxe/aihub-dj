name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Require a version tag matching the package
        run: node -e "const p=require('./package.json');if(process.env.GITHUB_REF !== 'refs/tags/v'+p.version)throw new Error('Run this workflow on tag v'+p.version)"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  build:
    needs: verify
    name: Build and stage Windows release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run package
      - run: npm run verify:release
      - name: Upload a complete, verified draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $draft = gh release view $tag --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne 'true') { throw 'Refusing to overwrite a published release.' }
          } else {
            gh release create $tag --draft --target $env:GITHUB_SHA --title "AIHub DJ $tag" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create draft release.' }
          }
          gh release upload $tag dist/AIHub-DJ-Setup.exe dist/AIHub-DJ-Setup.exe.blockmap dist/latest.yml dist/SHA256SUMS.txt --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed.' }

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish only after verification and all assets are uploaded
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
