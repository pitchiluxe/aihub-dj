<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1145"/>
      <stop offset="0.55" stop-color="#140a26"/>
      <stop offset="1" stop-color="#07060d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#7c3aed" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a855f7"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="vinyl" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#26262c"/>
      <stop offset="0.7" stop-color="#101014"/>
      <stop offset="1" stop-color="#050506"/>
    </radialGradient>
    <radialGradient id="label" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ff6ad5"/>
      <stop offset="0.55" stop-color="#ff2b8a"/>
      <stop offset="1" stop-color="#c0124a"/>
    </radialGradient>
    <linearGradient id="arm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#9aa0a8"/>
    </linearGradient>
    <clipPath id="tileClip"><rect x="8" y="8" width="240" height="240" rx="56"/></clipPath>
  </defs>

  <!-- App tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="8" y="8" width="240" height="240" fill="url(#glow)"/>
    <!-- Two club beams from the top corners -->
    <path d="M30 8 L70 8 L150 248 L96 248 Z" fill="#22d3ee" opacity="0.10"/>
    <path d="M186 8 L226 8 L176 248 L120 248 Z" fill="#ff2bd6" opacity="0.10"/>
  </g>
  <rect x="9.5" y="9.5" width="237" height="237" rx="54.5" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="3"/>

  <!-- Neon ring -->
  <circle cx="122" cy="136" r="92" fill="none" stroke="url(#neon)" stroke-width="7"/>
  <circle cx="122" cy="136" r="92" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5"/>

  <!-- Record -->
  <circle cx="122" cy="136" r="82" fill="url(#vinyl)"/>
  <g fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.2">
    <circle cx="122" cy="136" r="74"/><circle cx="122" cy="136" r="66"/><circle cx="122" cy="136" r="58"/>
    <circle cx="122" cy="136" r="50"/><circle cx="122" cy="136" r="42"/>
  </g>
  <!-- Light sheen across the grooves -->
  <path d="M122 136 L76 64 A82 82 0 0 1 108 55 Z" fill="#ffffff" opacity="0.16"/>
  <path d="M122 136 L168 208 A82 82 0 0 1 136 217 Z" fill="#ffffff" opacity="0.10"/>

  <!-- Label -->
  <circle cx="122" cy="136" r="33" fill="url(#label)"/>
  <circle cx="122" cy="136" r="33" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="2"/>
  <text x="122" y="147" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="900" fill="#ffffff" letter-spacing="-0.5">DJ</text>
  <circle cx="122" cy="136" r="3.2" fill="#f1f3f5"/>

  <!-- Tonearm -->
  <circle cx="204" cy="52" r="15" fill="#1d1f24" stroke="url(#arm)" stroke-width="3"/>
  <circle cx="204" cy="52" r="5" fill="url(#arm)"/>
  <path d="M204 52 L212 120 L170 168" fill="none" stroke="url(#arm)" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="156" y="160" width="20" height="26" rx="4" fill="#2b2d33" stroke="#9aa0a8" stroke-width="2" transform="rotate(40 166 173)"/>
</svg>
